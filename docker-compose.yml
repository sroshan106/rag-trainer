services:
  ollama:
    image: ollama/ollama:0.32.14
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      # This has to live on the server, not the app container -- the app
      # never reads it, Ollama does. Keeping only one model resident forces
      # a full GPU offload for whichever one is loaded (chat or embedder)
      # instead of splitting the 4GB card between both and spilling the
      # chat model's layers onto CPU.
      OLLAMA_MAX_LOADED_MODELS: "1"
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  ollama-pull:
    image: ollama/ollama:0.32.14
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: /bin/sh
    command:
      - -c
      - "OLLAMA_HOST=ollama:11434 ollama pull llama3.2:3b && OLLAMA_HOST=ollama:11434 ollama pull qwen3:4b && OLLAMA_HOST=ollama:11434 ollama pull nomic-embed-text"
    restart: "no"

  db:
    image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
    restart: unless-stopped
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag_db
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://rag:rag@db:5432/rag_db
      OLLAMA_BASE_URL: http://ollama:11434
      RAG_CITATIONS: "${RAG_CITATIONS:-true}"
      RAG_RERANK: "${RAG_RERANK:-true}"
      RAG_FETCH_K: "${RAG_FETCH_K:-20}"
      RAG_NUM_CTX: "${RAG_NUM_CTX:-8192}"
      RAG_NUM_CTX_QWEN3: "${RAG_NUM_CTX_QWEN3:-3072}"
    volumes:
      - ./data:/app/data
      - ./src:/app/src
    ports:
      - "8000:8000"

  ui:
    build: ./ui
    restart: "no"
    depends_on:
      - app
    environment:
      VITE_API_PROXY_TARGET: http://app:8000
    volumes:
      - ./ui:/app
      - ui_node_modules:/app/node_modules
    ports:
      - "5173:5173"

volumes:
  pg_data:
  ollama_data:
  ui_node_modules:
