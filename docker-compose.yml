services:
  ollama:
    image: ollama/ollama:0.32.14
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      OLLAMA_MAX_LOADED_MODELS: "2"
      # This Ollama build caps embedding models to n_slots=1 regardless of
      # this setting (confirmed in its own startup log), so raising it buys
      # embedding nothing. It DOES pre-reserve KV-cache per slot for chat
      # models though -- RAG_NUM_CTX_QWEN3 is already tuned to the largest
      # context that fits this 4GB card at 1 slot, so anything above 1 here
      # risks OOM/CPU-spillover the moment two chat requests overlap (e.g. a
      # Benchmark run with concurrent workers).
      OLLAMA_NUM_PARALLEL: "${OLLAMA_NUM_PARALLEL:-1}"
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  db:
    image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
    restart: unless-stopped
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag_db
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: "no"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://rag:rag@db:5432/rag_db
      OLLAMA_BASE_URL: http://ollama:11434
      RAG_CITATIONS: "${RAG_CITATIONS:-true}"
      RAG_RERANK: "${RAG_RERANK:-true}"
      RAG_FETCH_K: "${RAG_FETCH_K:-20}"
      RAG_NUM_CTX: "${RAG_NUM_CTX:-8192}"
      RAG_NUM_CTX_QWEN3: "${RAG_NUM_CTX_QWEN3:-3072}"
      RAG_EMBED_BATCH: "${RAG_EMBED_BATCH:-1024}"
      # The embedding model runs with n_slots=1 on this Ollama build --
      # concurrent workers just queue behind the one slot and add scheduling
      # overhead for nothing. See RAG_EMBED_BATCH above for the actual lever
      # (fewer, larger requests) instead.
      RAG_EMBED_WORKERS: "${RAG_EMBED_WORKERS:-1}"
    volumes:
      - ./data:/app/data
      - ./src:/app/src
    ports:
      - "8000:8000"

  ui:
    build: ./ui
    restart: "no"
    depends_on:
      - app
    environment:
      VITE_API_PROXY_TARGET: http://app:8000
    volumes:
      - ./ui:/app
      - ui_node_modules:/app/node_modules
    ports:
      - "5173:5173"

volumes:
  pg_data:
  ollama_data:
  ui_node_modules:
